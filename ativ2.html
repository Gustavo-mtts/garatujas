<!DOCTYPE html>
<html lang="pt-br">
    <meta charset="UTF-8">
    <head>
        <title>Formulário de fã do TYLER, THE CREATOR</title>
    </head>
    <body>

        <form action="#" method="post">
            <fieldset>
                <div>
                    <label>nome</label>
                    <input type="texto" name="nome" id="nome">
                </div>

                <div>
                    <label>sobrenome</label>
                    <input type="texto" name="sobrenome" id="sobrenome">
                </div>

                <div>
                   <label>email</label>
                   <input type="email" name="email" id="email">
                </div>

                <div>
                    <p>Nigga coloque seu gênero:</p>
                     <input type="radio" id="masc" name="genero" value="m">
                     <label for="masc">Masculino</label>

                     <input type="radio" id="fem" name="genero" value="f">
                     <label for="fem">Feminino</label>

                    <p>seus albuns favoritos do tyler!:</p>
                     <input type="checkbox" id="Bastard" name="interesse" value="Bastard">
                     <label for="Bastard">BASTARD</label>

                     <input type="checkbox" id="Goblin" name="interesse" value="Goblin">
                     <label for="Goblin">GOBLIN</label>

                     <input type="checkbox" id="Wolf" name="interesse" value="Wolf">
                     <label for="Wolf">WOLF</label>

                     <input type="checkbox" id="Cherry Bomb" name="interesse" value="Cherry Bomb>
                     <label for="Cherry Bomb">CHERRY BOMB</label>

                     <input type="checkbox" id="Flower Boy" name="interesse" value="Flower Boy">
                     <label for="">FLOWER BOY</label>

                     <input type="checkbox" id="Igor" name="interesse" value="Igor">
                     <label for="Igor">IGOR</label>

                     <input type="checkbox" id="Call Me If You Get Lost" name="interesse" value="Call If You Get Lost">
                     <label for="Call Me If You Get Lost">CALL ME IF YOU GET LOST</label>

                     <input type="checkbox" id="Chromakopia" name="interesse" value="Chromakopia">
                     <label for="Chromakopia">CHROMAKOPIA</label>

                     <input type="checkbox" id="Dont Tap The Glass" name="interesse" value="Dont Tap The Glass">
                     <label for="Dont Tap The Glass">DONT TAP THE GLASS</label>

                </div>

            </fieldset>

            

        </form>

    </body>
</html>
